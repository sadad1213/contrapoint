// Default controls. User overrides are saved to user://cfg/config.cfg.
unbindall
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"
bind "UPARROW" "+lookup"
bind "DOWNARROW" "+lookdown"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"
bind "r" "+reload"
bind "e" "+use"
bind "f" "+lookatweapon"
bind "q" "lastinv"
bind "g" "drop"
bind "m" "chooseteam"
bind "b" "buymenu"
bind "F1" "autobuy"
bind "F2" "rebuy"
bind "TAB" "+showscores"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "KP_END" "slot1"
bind "KP_DOWNARROW" "slot2"
bind "KP_PGDN" "slot3"
